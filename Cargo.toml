# The Kitsune cargo workspace.
#
# `crates/kitsune-core` holds the pure, framework-agnostic backend logic;
# `crates/kitsune-qt` is the Qt6/QML frontend that ships. There used to be a
# third member, `src-tauri`, which was the app the Qt frontend replaced.
#
# A workspace keeps a single `Cargo.lock` at the repo root and a single
# `target/`, so a dependency is compiled once no matter how many members use it.
[workspace]
resolver = "2"
members = ["crates/kitsune-core", "crates/kitsune-qt"]

# One version for the whole workspace. Members inherit it with
# `version.workspace = true`, so Cargo -- not a script -- is the authority:
# it validates this value and regenerates Cargo.lock from it. Previously the
# version lived in tauri.conf.json and three other files had to be patched to
# match it by hand.
#
# Bump with: cargo set-version --workspace X.Y.Z (or edit this line, then let
# the next build rewrite Cargo.lock).
[workspace.package]
version = "1.1.0"
edition = "2021"

# Release profile lives HERE, not in a member. Cargo ignores a [profile.*]
# table in a non-root member of a virtual workspace, so keeping it in
# src-tauri/Cargo.toml would silently do nothing.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# librqbit is VENDORED: vendor/librqbit holds a patched copy of crates.io's
# librqbit 9.0.1. The stock crate kills an HTTP stream the moment a read hits
# a piece that RAM eviction removed but the `have` bitfield still claims is
# present ("not resident (evicted)") -- with empty `only_files` selection the
# bitfield is never repaired, so every mpv retry dies on the same ghost piece
# and the player black-screens. The vendored copy instead re-queues missing
# pieces and makes readers wait for re-download, plus a watchdog that kicks
# backoff-stalled peers on resume and stream-aware piece stealing that
# prioritizes the piece the player is blocked on. Patches live in
# patches/librqbit-streaming-fixes.patch; see vendor/librqbit/README.md.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }