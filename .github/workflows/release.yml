name: release

# Build Kitsune for Linux (x64) and Windows (x64) and attach the installers to
# a GitHub Release.
#
# Push a version tag (e.g. `v0.1.0`) to build and publish. The tag must match
# the `version` in package.json / src-tauri/tauri.conf.json, because the action
# substitutes __VERSION__ from the app metadata.
#
# The release is created as a DRAFT so you can review the assets before anyone
# can download them. Publish it from the Releases page when you're happy.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action needs to create a release and upload assets.
permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04" # Linux x64 (.AppImage, .deb, .rpm)
            args: ""
          - platform: "windows-latest" # Windows x64 (.msi, -setup.exe)
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WebKitGTK 4.1 and the tray/indicator + SVG libs are what the webview and
      # the appindicator need to link. `libfuse2` is what lets the produced
      # AppImage run on the runner; end users may need it too (see README).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          # Tauri's default layout: the Rust crate lives in src-tauri.
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The action replaces __VERSION__ with the app version.
          tagName: v__VERSION__
          releaseName: "Kitsune v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}