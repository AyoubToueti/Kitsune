name: AI Changelog

on:
  workflow_dispatch: # Lets you trigger it manually with a button click
    inputs:
      range:
        description: "Git range to cover (use HEAD for the full history). Leave empty for last tag..HEAD."
        required: false
        default: ""

permissions:
  contents: write
  models: read
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog and open PR
        uses: decoded-cipher/auto-changelog@ce67adee794e2602d0850a290bccffd9cb3ee1f9 # v1.1.0
        with:
          range: ${{ inputs.range }}
          output_path: CHANGELOG.md
          create_pr: true
          changelog_branch: auto/changelog
          base_branch: main
