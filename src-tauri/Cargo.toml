[package]
name = "kitsune"
version = "0.1.0"
description = "Anime streaming app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kitsune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librqbit = { version = "9.0.1", features = ["http-api", "tracing-subscriber-utils"] }
anyhow = "1.0.104"
librqbit-dualstack-sockets = "0.7.0"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "net"] }
tracing = "0.1.44"
# The subscriber that makes the `tracing` calls throughout the crate actually
# go somewhere. Without it they are silently dropped, and a release GUI build
# on Windows has no console to fall back on. `env-filter` is what lets RUST_LOG
# tune the level; the file half of the sink lives in `diagnostics::logging`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Daily-rotating file sink, paired with the non-blocking writer so a slow disk
# cannot stall the async runtime.
tracing-appender = "0.2"
# Reads this process's own CPU and resident memory for the diagnostics panel
# and the periodic log line. Cross-platform: /proc on Linux, native APIs on
# Windows and macOS.
sysinfo = "0.39"
reqwest = { version = "0.13.5", features = ["json", "default-tls"] }
async-trait = "0.1.92"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-deep-link = "2"
# Release-name parsing ports Sonarr's regexes, which use lookaround and
# backreferences that the `regex` crate cannot express.
fancy-regex = "0.14"
quick-xml = "0.37"
once_cell = "1"
# The metadata probe needs a scratch directory it can drop when it is done.
tempfile = "3.27.0"
# Resolves the OS data directory for the AniList token store. Already present
# transitively in Cargo.lock, so this promotes rather than adds to the graph.
dirs = "6"
# Encodes a player's icon as a data URL for the picker. The CSP allows `data:`
# but not `file:`, so the bytes have to travel inline. Already in the graph
# transitively, so this promotes rather than adds to it.
base64 = "0.22"

# Desktop only: single-instance has no mobile equivalent, and the `deep-link`
# feature is what makes a link delivered to a second process reach the running
# one. On Linux and Windows a deep link arrives as a command-line argument to a
# NEW process, so without this the app would open twice and the original would
# never see the token.
#
# MUST stay last: a `[target...]` header makes every key below it belong to that
# table, so anything placed after this line silently becomes desktop-only.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Linux only: the native "Open With" app chooser. GTK 3 is already linked by
# WebKitGTK through wry, so this adds a direct dependency on a crate that is
# already in the graph -- no new version, no flake change.
[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18.2"

# Windows only: reads HKEY_CLASSES_ROOT to find the players registered for
# video files, which is how Windows itself decides what opens a `.mkv`. Already
# in the graph transitively, so this promotes rather than adds to it.
[target."cfg(windows)".dependencies]
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4.5"
wiremock = "0.6.5"
